<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Barrierefreier Veranstaltungskalender für Ihre Gemeinde" />
    <meta name="theme-color" content="#3b7d34" />
    <title>Gemeindekalender</title>
  </head>
  <body>
    <!-- Skip-Link für Barrierefreiheit -->
    <a href="#main-content" class="skip-link">
      Zum Hauptinhalt springen
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Translate: initialisiert doGTranslate() global -->
    <div id="google_translate_element" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'de',
          autoDisplay: false,
        }, 'google_translate_element');
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
